name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  hadolint:
    name: lint Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3008: pin apt versions — noisy and we already trust slim base
          # DL3013: pin pip versions — uv replaces pip here
          ignore: DL3008,DL3013
          failure-threshold: warning

  build:
    name: build & publish
    needs: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=s3p-tape-service
            org.opencontainers.image.description=Backend for the S3 Platform web annotation tool

      # Build amd64 image into the runner's docker daemon so we can smoke-test
      # the actual artifact before publishing. Layers populate the GHA cache
      # and are reused by the multi-arch build below.
      - name: Build image for smoke test (amd64, loaded)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: tape-service:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — entry points on PATH
        run: |
          docker run --rm --entrypoint sh tape-service:smoke -c '
            set -eu
            command -v tape-service-api
            command -v tape-service-worker
          '

      - name: Smoke test — package imports & FastAPI app instantiates
        run: |
          docker run --rm --entrypoint python tape-service:smoke -c '
          import importlib, sys
          for mod in ("tape_service", "tape_service.main", "tape_service.worker_entry"):
              importlib.import_module(mod)
          from tape_service.main import create_app
          app = create_app()
          routes = {r.path for r in app.routes}
          assert "/health" in routes, f"/health not registered: {routes}"
          print("smoke ok:", app.title, app.version)
          '

      - name: Smoke test — runs as non-root
        run: |
          uid="$(docker run --rm --entrypoint id tape-service:smoke -u)"
          test "$uid" = "10001" || { echo "expected uid 10001, got $uid"; exit 1; }

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
