services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sppadmin
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: s3p
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sppadmin -d s3p"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      pg:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sppadmin:devpass@pg:5432/s3p
      SESSION_SECRET: ${SESSION_SECRET:-dev-dev-dev-dev-dev-dev-dev-dev-dev-dev}
      SESSION_COOKIE_SECURE: "false"
      LOG_LEVEL: INFO
    ports: ["8000:8000"]

  worker:
    build: .
    depends_on:
      pg:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sppadmin:devpass@pg:5432/s3p
      SESSION_SECRET: ${SESSION_SECRET:-dev-dev-dev-dev-dev-dev-dev-dev-dev-dev}
      LOG_LEVEL: INFO
      WORKER_INTERVAL_SECONDS: "5"
    command: ["python", "-m", "tape_service.worker_entry"]
