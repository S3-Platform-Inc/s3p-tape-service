services:
  pg:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sppadmin
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: s3p
    volumes:
      - ./docs/sql:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    # Host port 15432 to avoid colliding with other platform stacks
    # (e.g. petrolab-db-1) that bind 5432.
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sppadmin -d s3p"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-devredis}
      --appendonly yes
      --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devredis}
    volumes:
      - redis-data:/data
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-devredis} --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sppadmin:devpass@pg:5432/s3p
      REDIS_URL: redis://:${REDIS_PASSWORD:-devredis}@redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:-dev-dev-dev-dev-dev-dev-dev-dev-dev-dev}
      SESSION_COOKIE_SECURE: "false"
      LOG_LEVEL: INFO
    ports: ["8000:8000"]

  worker:
    build: .
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sppadmin:devpass@pg:5432/s3p
      REDIS_URL: redis://:${REDIS_PASSWORD:-devredis}@redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:-dev-dev-dev-dev-dev-dev-dev-dev-dev-dev}
      LOG_LEVEL: INFO
      WORKER_INTERVAL_SECONDS: "5"
    command: ["python", "-m", "tape_service.worker_entry"]

volumes:
  pg-data:
  redis-data:
