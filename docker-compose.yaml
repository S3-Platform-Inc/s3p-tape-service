# Compose stack for prod AND stage.
#
# Both environments run the same shape (api + worker only); they
# differ only in the secret values supplied via .env. Postgres and
# Redis are external platform-managed services — only their URLs
# are wired in.
#
# Differences from compose.dev.yaml:
#   - api/worker use the pre-built image, not `build: .`
#   - pg is NOT included — uses the platform's s3p-database;
#     only DATABASE_URL is wired through.
#   - redis is NOT included — uses the platform's managed Redis;
#     only REDIS_URL is wired through (password embedded in the URL).
#   - secrets are required (?required); no dev fallbacks.
#   - restart: unless-stopped on every long-lived service.
#
# Usage (this file is Docker Compose's default; no -f flag needed):
#   TAG=1.2.0 \
#   DATABASE_URL=postgresql://user:pw@db.internal:5432/s3p \
#   REDIS_URL=redis://:password@redis.internal:6379/0 \
#   SESSION_SECRET=$(openssl rand -hex 32) \
#   docker compose up -d

services:
  api:
    image: ghcr.io/s3-platform-inc/s3p-tape-service:${TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      REDIS_URL: ${REDIS_URL:?required}
      SESSION_SECRET: ${SESSION_SECRET:?required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [internal]
    ports:
      - 8000:8000

  worker:
    image: ghcr.io/s3-platform-inc/s3p-tape-service:${TAG:-latest}
    command: ["python", "-m", "tape_service.worker_entry"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      REDIS_URL: ${REDIS_URL:?required}
      SESSION_SECRET: ${SESSION_SECRET:?required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-60}
    restart: unless-stopped
    networks: [internal]

networks:
  internal:
    driver: bridge
