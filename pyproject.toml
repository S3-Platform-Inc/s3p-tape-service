[project]
name = "s3p-tape-service"
version = "0.1.0"
description = "Backend for the S3 Platform web annotation tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.137.0",
    "uvicorn[standard]>=0.38",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "apscheduler>=3.10,<4",
    "redis>=5",
    "s3p-sdk>=0.2.13",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=5",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.15.17",
    "mypy>=1.11",
]

[project.scripts]
tape-service-api = "tape_service.main:run"
tape-service-worker = "tape_service.worker_entry:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tape_service"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Test seed tokens are public dev-only literals; not real secrets.
"tests/**" = ["S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Header/Query/Cookie are designed to live in arg defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Cookie",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require a running postgres",
]
